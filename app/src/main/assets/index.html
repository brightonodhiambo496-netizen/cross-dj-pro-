<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070c16">
<title>Cross DJ Pro</title>
<style>
:root{--bg:#070c16;--bd:#1b2740;--mu:#8fa0b8;--A:#1a9fff;--B:#ff7a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:var(--bg);color:#eaf1ff;font-family:Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.A{--c:var(--A);--cd:#0d73c9;--t:#12365e}
.B{--c:var(--B);--cd:#d9650f;--t:#4a2410}
#app{height:100vh;display:grid;grid-template-rows:10.5vh 18vh 1fr 13.5vh}
header{display:flex;align-items:center;justify-content:space-between;padding:0 2vw;border-bottom:1px solid var(--bd);background:#0a111e}
.hl,.hr{display:flex;align-items:center;gap:2.2vw}
.brand{display:flex;align-items:center;gap:1vw;font-weight:700;font-size:5.2vh}
.brand b{color:var(--A)}
#logo{height:8.4vh;width:auto}.lg{height:7.4vh;width:7.4vh;border-radius:50%}
.lg{background:radial-gradient(circle,#0a111e 0 22%,#fff 25%)}
.tabs{display:flex}
.tabs button{background:#0a1220;border:1px solid var(--bd);padding:1.6vh 3.4vw;font-size:3.3vh;font-weight:600;color:var(--mu)}
.tabs .on{color:var(--A);border-color:var(--A);background:#0b1d33}
.ib{background:none;border:0;font-size:3.3vh;padding:1vh;color:#cfd9ea;display:flex;align-items:center;gap:.8vh}
#recDot{width:1.2vh;height:1.2vh;border-radius:50%;background:#6b7a90;display:inline-block}
.rec #recDot{background:#ff2d4d}
.wr{display:grid;grid-template-columns:1fr 9vw 1fr;background:#05090f}
.wv{position:relative;min-width:0}
.inf{position:absolute;left:0;right:0;top:0;height:42%;display:flex;align-items:center;gap:1.2vw;padding:0 1.2vw}
.tile{width:8vh;height:8vh;border-radius:1vh;background:var(--t);color:var(--c);display:flex;align-items:center;justify-content:center;font-size:4vh;flex:none}
.nm{flex:1;min-width:0}
.ti{font-size:3.5vh;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar{font-size:2.8vh;color:var(--mu)}
.rt{text-align:right;flex:none}.tm{font-size:3.5vh}.bp{font-size:2.8vh;padding:.5vh 0;color:var(--mu)}
canvas{position:absolute;left:0;bottom:0;width:100%;height:58%}
.mid{display:flex;align-items:center;justify-content:center}
.mid div{width:10vh;height:10vh;border-radius:50%;border:.3vh solid #1f3a5a;background:#0a1626;display:flex;align-items:center;justify-content:center}
.mn{display:grid;grid-template-columns:37fr 26fr 37fr;border-top:1px solid var(--bd);min-height:0}
.dk{display:flex;align-items:center;padding:1vh 1vw;gap:1vw;min-height:0}
.dk.B{flex-direction:row-reverse}
.side{width:11.5vw;height:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch}
.sb{height:8vh;background:#0a1322;border:1px solid #27354f;border-radius:.8vh;font-size:3.2vh;font-weight:600;color:#cfd9ea}
.sb.on{color:var(--c);border-color:var(--c)}
.pb{height:8.8vh;border:.3vh solid var(--c);font-size:3.8vh}
.tp{display:flex;flex-direction:column;align-items:center;flex:1;min-height:0;padding:.5vh 0}
.tp .vs{flex:1;width:8vh}
.lb{font-size:2.6vh;color:var(--mu);text-align:center}
.pl{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
.ring{--p:0deg;position:relative;width:min(41vh,100%);aspect-ratio:1;border-radius:50%;background:#04070d}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--c) var(--p),var(--cd) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - .8vh),#000 calc(100% - .8vh + 1px));mask:radial-gradient(farthest-side,transparent calc(100% - .8vh),#000 calc(100% - .8vh + 1px))}
.vin{position:absolute;inset:3.5%;border-radius:50%;background:repeating-radial-gradient(circle,#0b0f18 0 .3vh,#151b29 .3vh .45vh);box-shadow:inset 0 0 3vh #000}
.vin::after{content:"";position:absolute;left:50%;top:2%;width:.35vh;height:6%;background:#cfd9ea;opacity:.7;transform:translateX(-50%)}
.lab{position:absolute;left:50%;top:50%;width:35%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:.5vh solid var(--c);background:#080e18;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.3vh;font-weight:700;gap:.6vh}

.mx{display:grid;grid-template-columns:1fr .85fr 1fr;border-left:1px solid var(--bd);border-right:1px solid var(--bd);min-height:0}
.ch{display:flex;flex-direction:column;align-items:center;padding:1vh 0;gap:.6vh;min-height:0}
.kw{display:flex;flex-direction:column;align-items:center}
.knob{width:8vh;height:8vh}.knob svg{width:100%;height:100%}
.vs{position:relative;width:8vh;--hh:3vh}
.vs::before{content:"";position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%)}
.f{flex:1;margin-top:1vh;width:10vh}
.f::before{width:.5vh;background:#1a2538}
.t::before{width:2.6vh;background:#0c1421;border:1px solid #1d2a40;border-radius:1vh}
.vs i{position:absolute;left:50%;transform:translateX(-50%);bottom:0;height:calc(var(--v)*100%);width:.5vh;background:var(--c)}
.t i{display:none}
.vs b{position:absolute;left:0;right:0;height:var(--hh);bottom:calc(var(--v)*(100% - var(--hh)));border-radius:.4vh;background:#e8edf5}
.t b{background:var(--c);left:10%;right:10%}
.mt{display:flex;flex-direction:column;align-items:center;padding:1.2vh 0}
.mb{display:flex;gap:.8vh;height:24vh;margin-top:1vh}
.bar{width:2.4vh;display:flex;flex-direction:column-reverse;gap:.4vh}
.bar s{display:block;flex:1;border-radius:.3vh;background:#1a2332}
.bar s.on.g{background:#2ecc40}.bar s.on.y{background:#ffd21a}.bar s.on.o{background:#ff8c1a}.bar s.on.r{background:#ff3b30}
.bt{display:grid;grid-template-columns:26vw 1fr 26vw;align-items:center;border-top:1px solid var(--bd);padding:0 2vw;gap:2vw}
.sy{display:flex;align-items:center}
.sync{height:10vh;flex:1.5;background:#0a1322;border:.3vh solid var(--c);border-radius:.8vh;font-size:3.5vh;font-weight:600}
.bx{flex:1;height:10vh;display:flex;align-items:center;justify-content:center;background:#0c1524;border:1px solid #1d2a40;font-size:3.5vh;color:#cfd9ea}
.xf{height:11vh;background:#0a1220;border:1px solid #17233a;border-radius:1.2vh;display:flex;align-items:center;gap:2vw;padding:0 3vw}
.arr{background:none;border:0;color:#cfd9ea;font-size:4vh;padding:1vh 2vw}
.h{flex:1;height:8vh;position:relative;--hw:3.6vh}
.h::before{content:"";position:absolute;left:0;right:0;top:50%;height:.8vh;transform:translateY(-50%);border-radius:.4vh;background:linear-gradient(90deg,#1a9fff calc(var(--v)*100%),#ff7a1f 0)}
.h b{position:absolute;top:0;bottom:0;width:var(--hw);left:calc(var(--v)*(100% - var(--hw)));background:#c9d1dc;border:.3vh solid #5d6878;border-radius:.4vh}
.ov{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9}
.ov.show{display:flex}
.box{background:#0c1423;border:1px solid var(--bd);border-radius:1.5vh;padding:2vh;width:70vw;max-height:88vh;overflow:auto;font-size:3.2vh}
.box,.box *{touch-action:auto}
.box input[type=text]{user-select:text;width:100%;background:#090e17;color:#fff;border:1px solid #35445b;padding:1.6vh;border-radius:1vh;font-size:3.2vh}
.box input[type=range]{width:100%}
.box h3{margin:0 0 1vh}
.act{width:100%;margin-top:1vh;padding:1.8vh;background:#202b3d;border:1px solid #35445b;border-radius:1vh;font-weight:700;font-size:3.2vh}
.fxr{display:flex;flex-wrap:wrap;gap:1vh;margin:1vh 0}.fxr .act{width:auto;flex:1;margin:0}.fxr .act.on{border-color:#1a9fff;color:#1a9fff}
.box input[type=range]{height:5vh}
.row{display:flex;gap:1vw;align-items:center;margin-top:1vh}.row div{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .act{width:auto;margin:0;padding:1vh 2vw}
#chat{height:22vh;overflow:auto;background:#090e17;padding:1vh;border-radius:1vh}
#chat p{margin:.8vh 0}
.hid{display:none}
</style>
